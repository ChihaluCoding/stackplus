plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"stackplus" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.register("unitTest", JavaExec) {
	group = "verification"
	description = "Runs StackPlus unit tests without Loom's game test classloader."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "chihalu.stackplus.StackLimitMathTest"
}

test {
	enabled = false
	dependsOn unitTest
}

check.dependsOn unitTest

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
def prismInstancesRoot = new File(System.getenv('APPDATA'), 'PrismLauncher/instances')
def prismInstanceName = providers.gradleProperty('prismInstanceName').orElse(providers.gradleProperty('minecraft_version'))
def prismModsDir = prismInstanceName.map { new File(prismInstancesRoot, "${it}/minecraft/mods") }
def deployArchiveBaseName = providers.gradleProperty('archives_base_name').get()

tasks.register('deployToPrismMods') {
	doLast {
		def outputJarCandidates = fileTree(layout.buildDirectory.dir('libs').get().asFile) {
			include "${deployArchiveBaseName}-*.jar"
			exclude "${deployArchiveBaseName}-*-sources.jar"
		}.files.sort { a, b -> a.lastModified() <=> b.lastModified() }
		if (outputJarCandidates.isEmpty()) {
			throw new GradleException("配置対象の jar が build/libs に見つかりません: ${deployArchiveBaseName}")
		}
		def outputJar = outputJarCandidates.last()
		def targetDir = prismModsDir.get()
		targetDir.mkdirs()
		fileTree(targetDir) {
			include "${deployArchiveBaseName}-*.jar"
		}.files.each { it.delete() }
		copy {
			from outputJar
			into targetDir
		}
	}
}

tasks.named('build') {
	finalizedBy tasks.named('deployToPrismMods')
}
